name: CI

on:
  push:
    branches:
      - develop
      - main
      - adnw-7758  # Temporary: for testing workflow
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test
        env:
          TERM: dumb
          JVM_OPTS: -Xmx3200m

      - name: Build with Gradle
        run: ./gradlew publish
        env:
          TERM: dumb
          JVM_OPTS: -Xmx3200m

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/repo
          retention-days: 7
